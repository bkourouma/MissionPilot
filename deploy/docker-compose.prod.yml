# Production de MissionPilot sur le VPS Alliance (147.93.44.169), cabinetpilot.allianceconsultants.net.
# Lancé par deploy/deploy.sh (workflow .github/workflows/deploy.yml). Variables attendues :
#   MP_IMAGE          image à déployer (ghcr.io/bkourouma/missionpilot:<sha>)
#   POSTGRES_PASSWORD lu dans /home/deployer/missionpilot.env (passé par --env-file)
# Le fichier d'environnement du serveur n'est JAMAIS dans le dépôt : voir docs/workflows/DEPLOIEMENT.md.
name: missionpilot

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Le schéma compte plus de 700 relations (voir docker-compose.yml du dépôt).
    command: ["postgres", "-c", "max_locks_per_transaction=256"]
    environment:
      POSTGRES_USER: missionpilot_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD absent de missionpilot.env}
      POSTGRES_DB: missionpilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U missionpilot_owner -d missionpilot"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [interne]

  api:
    image: ${MP_IMAGE:?MP_IMAGE absente}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: /home/deployer/missionpilot.env
    environment:
      NODE_ENV: production
      API_PORT: "4100"
      WEB_ORIGIN: https://cabinetpilot.allianceconsultants.net
    working_dir: /app/apps/api
    command: ["node_modules/.bin/tsx", "src/server.ts"]
    volumes:
      - stockage:/data/stockage
    # Le web partage l'espace réseau de ce conteneur (l'API n'écoute que sur 127.0.0.1) :
    # c'est ici que le port du web est publié, sur l'hôte local seulement (nginx fait le TLS).
    ports:
      - "127.0.0.1:3050:3100"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4100/api/sante').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [interne]

  web:
    image: ${MP_IMAGE:?MP_IMAGE absente}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    network_mode: "service:api"
    environment:
      NODE_ENV: production
    working_dir: /app/apps/web
    command: ["node_modules/.bin/next", "start", "-p", "3100"]

networks:
  interne:

volumes:
  pgdata:
  stockage:
