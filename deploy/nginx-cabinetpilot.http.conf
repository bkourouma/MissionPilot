# Vhost temporaire, HTTP seul : sert uniquement à l'amorçage, pour que certbot valide le
# challenge ACME avant qu'un certificat existe. Remplacé ensuite par nginx-cabinetpilot.conf.
server {
    listen 80;
    listen [::]:80;
    server_name cabinetpilot.allianceconsultants.net;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 503;
    }
}
