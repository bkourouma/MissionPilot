# Vhost de production : nginx (hôte) termine le TLS et relaie vers le web, publié sur 127.0.0.1:3050.
#
#   sudo cp deploy/nginx-cabinetpilot.conf /etc/nginx/sites-available/cabinetpilot.allianceconsultants.net
#   sudo ln -sfn /etc/nginx/sites-available/cabinetpilot.allianceconsultants.net /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name cabinetpilot.allianceconsultants.net;

    # Laissé ouvert en HTTP : certbot renouvelle par webroot.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 : HTTP/2 en paramètre de `listen`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cabinetpilot.allianceconsultants.net;

    ssl_certificate     /etc/letsencrypt/live/cabinetpilot.allianceconsultants.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cabinetpilot.allianceconsultants.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/cabinetpilot.allianceconsultants.net-access.log;
    error_log  /var/log/nginx/cabinetpilot.allianceconsultants.net-error.log;

    # Le plafond par fichier de l'application est 15 Mo par défaut (100 Mo au plus) : nginx suit.
    client_max_body_size 100M;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Un rapport PDF ou un import de documents peut approcher 90 s (relais Next : 90 s).
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
