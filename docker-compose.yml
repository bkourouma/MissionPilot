# Base de développement dédiée à MissionPilot (ne partage rien avec d'autres projets).
services:
  postgres:
    image: postgres:16-alpine
    container_name: missionpilot-postgres
    # Le schéma compte plus de 700 relations : DROP SCHEMA CASCADE (global-setup des tests)
    # dépasse les 64 verrous par transaction par défaut.
    command: ["postgres", "-c", "max_locks_per_transaction=256"]
    environment:
      POSTGRES_USER: missionpilot_owner
      POSTGRES_PASSWORD: dev_only_owner_password
      POSTGRES_DB: missionpilot
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - missionpilot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U missionpilot_owner -d missionpilot"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  missionpilot-pgdata:
